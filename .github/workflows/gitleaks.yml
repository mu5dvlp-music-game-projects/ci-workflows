name: Gitleaks

on:
  workflow_call:
    inputs:
      working-directory:
        description: "make gitleaks を実行するディレクトリ"
        required: false
        default: "."
        type: string

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（履歴全体）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: make gitleaks
        run: make gitleaks
        working-directory: ${{ inputs.working-directory }}
