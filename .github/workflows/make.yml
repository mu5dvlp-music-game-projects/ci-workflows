name: Make

on:
  workflow_call:
    inputs:
      target:
        description: "実行する Make ターゲット"
        required: true
        type: string
      setup:
        description: "ツールチェーンのセットアップ方法（none または mise）"
        required: false
        default: none
        type: string
      fetch-depth:
        description: "actions/checkout の fetch-depth"
        required: false
        default: 1
        type: number

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: setup の値を検証
        if: inputs.setup != 'none' && inputs.setup != 'mise'
        run: |
          echo "setup は none または mise で指定してください"
          exit 1

      - name: mise のツールチェーンをセットアップ
        if: inputs.setup == 'mise'
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          cache: true

      - name: make
        # inputs.target を run: のシェル文字列へ直接展開しない(zizmor template-injection 対応)。
        # env 経由にすることで、呼び出し元が渡す値にシェルの特殊文字が入っていても
        # コード注入にならない。
        env:
          MAKE_TARGET: ${{ inputs.target }}
        run: make "$MAKE_TARGET"
